services:
  web:
    build: .
    command: >
        bash -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/code
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - LOCATION=redis://redis:6379/2
  db:
    image: postgres:17-alpine
    ports:
      - "${DB_PORT}:5432"
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - DB_HOST=db
    healthcheck:
      test: "pg_isready -U ${DB_USER}"
      interval: 3s
      timeout: 3s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis
    command: redis-server
    ports:
      - "6379:6379"
    depends_on:
      - db
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
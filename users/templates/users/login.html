{% extends 'base_mailing.html' %}

{% block title %}Вход на сайт{% endblock %}
{% block content %}

<div class="container d-flex flex-column align-items-center">
    <form method="post" class="col-4" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Войти</button>
        <a href="{% url 'users:password_reset' %}" class="btn btn-secondary">Забыли пароль?</a>
    </form>
</div>
{% endblock %}

{% extends 'base_mailing.html' %}

{% block title %}Смена пароля{% endblock %}
{% block content %}
<div class="card mb-4 box-shadow w-50 p-4">
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary w-100">
            Отправить письмо
        </button>
    </form>
</div>
{% endblock %}
